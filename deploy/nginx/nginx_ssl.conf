map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS redirects for subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ollama.jetson;
    location /api/ {
        set $ollama_up "http://ollama:11434";
        #set $ollama_up "http://llama_cpp:8089";
        proxy_pass $ollama_up$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }
    # Ollama root
    location / {
        set $ollama_up "http://ollama:11434";
	#set $ollama_up "http://llama_cpp:8089";
        proxy_pass $ollama_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }
    location @ollama_unavailable {
        default_type text/plain;
        return 503 "Ollama temporarily unavailable\n";
    }
    # return 301 https://$host$request_uri;
}

# HTTPS default server (static + WebDAV)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/jetson.crt;
    ssl_certificate_key /etc/nginx/ssl/jetson.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location /webdav {
        alias /var/www/webdav;
        autoindex on;
        client_body_temp_path /var/tmp/nginx/webdav;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_access user:rw group:rw all:rw;
        client_max_body_size 0;
        create_full_put_path on;
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $dest $http_destination;
        if ($http_destination ~ "^http?://(.+)") {
            set $dest $1;
        }
        add_header DAV "1, 2" always;
        satisfy all;
    }

    location = /webui { return 301 https://webui.jetson$request_uri; }
    location /webui/ { return 301 https://webui.jetson/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
# Open WebUI — https://webui.jetson (resolved at request time so nginx starts without webui)
# Backend: open-webui container on same Docker network (open-webui/docker-compose.yml uses webui-net external)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webui.jetson;
    ssl_certificate /etc/nginx/ssl/jetson.crt;
    ssl_certificate_key /etc/nginx/ssl/jetson.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    location / {
        set $webui_up "http://open-webui:8080";
        proxy_pass $webui_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 4k;
        proxy_intercept_errors on;
        error_page 502 503 = @webui_unavailable;
    }

    location @webui_unavailable {
        default_type text/plain;
        return 503 "WebUI temporarily unavailable\n";
    }
}

# Ollama — https://ollama.jetson
# Single endpoint for MCP container: /mcp (protocol) and /mcp/* (agent: control UI, api/chat, etc.). / and /api/* → Ollama.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ollama.jetson;
    ssl_certificate /etc/nginx/ssl/jetson.crt;
    ssl_certificate_key /etc/nginx/ssl/jetson.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # MCP: browsers open /mcp (no slash) → must not hit port 8000 (protocol only). Redirect to agent on 8001.
    # No variable: nginx strips /mcp and forwards the rest to 8001. Requires mcp to be up (e.g. depends_on).
    location /mcp/ {
        #proxy_pass http://mcp:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @mcp_unavailable;
    }

    # Ollama API: all /api/*
    location /api/ {
        set $ollama_up "http://ollama:11434";
        #set $ollama_up "http://llama_cpp:8089";
        proxy_pass $ollama_up$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }

    location @mcp_unavailable {
        default_type text/plain;
        return 503 "MCP temporarily unavailable\n";
    }

    # Ollama root
    location / {
        set $ollama_up "http://ollama:11434";
	#set $ollama_up "http://llama_cpp:8089";
        proxy_pass $ollama_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }

    location @ollama_unavailable {
        default_type text/plain;
        return 503 "Ollama temporarily unavailable\n";
    }
}
