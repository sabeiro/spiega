#upstream ollama_upstream {
#        server ollama:11434 fail_timeout=5s max_fails=5;
#}
server {
    listen 80;
    listen [::]:80;
    server_name bottino;
    location /api/ {
        #set $ollama_up "http://ollama:11434";
        #set $ollama_up "http://llama_cpp:8089";
        #proxy_pass $ollama_up$request_uri;
        proxy_pass http://ollama:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }
    # Ollama root
    location / {
        #set $ollama_up "http://ollama:11434";
	#set $ollama_up "http://llama_cpp:8089";
        #proxy_pass $ollama_up;
        proxy_pass http://ollama:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @ollama_unavailable;
    }
    location @ollama_unavailable {
        default_type text/plain;
        return 503 "Ollama server temporarily unavailable\n";
    }
    # return 301 https://$host$request_uri;
    # MCP: browsers open /mcp (no slash) → must not hit port 8000 (protocol only). Redirect to agent on 8001.
    location = /mcp {
        if ($request_method = GET) {
            return 301 $scheme://$host/mcp/;
        }
        if ($request_method = HEAD) {
            return 301 $scheme://$host/mcp/;
        }
        # POST etc. → MCP protocol server (Emacs / streamable-http). Literal upstream (no variable).
        proxy_pass http://mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @mcp_unavailable;
    }
    # No variable: nginx strips /mcp and forwards the rest to 8001. Requires mcp to be up (e.g. depends_on).
    location /mcp/ {
        proxy_pass http://mcp:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 = @mcp_unavailable;
    }

}
