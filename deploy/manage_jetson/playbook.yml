# =============================================================================
# YOLO Pose Estimation Project - Ansible Playbook for NVIDIA Jetson
# =============================================================================
# This playbook sets up and runs the YOLO pose estimation project
# on NVIDIA Jetson devices (Orin, Xavier, Nano).
#
# Usage:
#   ansible-playbook -i inventory.yml playbook.yml
#   ansible-playbook -i inventory.yml playbook.yml --tags "python"
#   ansible-playbook -i inventory.yml playbook.yml --tags "openframeworks"
#
# Tags:
#   - setup: Install all dependencies
#   - opencv: Build OpenCV with CUDA
#   - python: Setup Python environment and run Python detector
#   - openframeworks: Build and run OpenFrameworks app
#   - model: Prepare YOLO models
# =============================================================================

---
- name: YOLO Pose Estimation Project Setup
  hosts: jetson
  become: yes
  gather_facts: yes

  vars:
    # Project paths
    project_dir: "/home/{{ ansible_user }}/cv"
    model_dir: "{{ project_dir }}/model"
    media_dir: "{{ project_dir }}/media"
    python_dir: "{{ project_dir }}/pose_estimate_py"
    of_dir: "{{ project_dir }}/pose_estimate_of"
    script_dir: "{{ project_dir }}/script"

    # OpenCV settings
    opencv_version: "4.10.0"
    opencv_build_dir: "/home/{{ ansible_user }}/opencv_build"
    cuda_arch: "8.7"  # Jetson Orin

    # OpenFrameworks settings
    of_version: "0.12.0"
    of_install_dir: "/home/{{ ansible_user }}/openFrameworks"

    # YOLO model settings
    yolo_model: "yolov8n-pose"
    yolo_input_size: 640

    # Python settings
    python_version: "python3"
    venv_dir: "{{ project_dir }}/venv"

    # Runtime settings
    video_source: "{{ media_dir }}/sfondo_seba.mp4"
    use_camera: false
    camera_id: 0

  handlers:
    - name: Reload ldconfig
      command: ldconfig

  tasks:
    # =========================================================================
    # SYSTEM SETUP
    # =========================================================================
    - name: System Setup
      tags: [setup, always]
      block:
        - name: Update apt cache
          apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Install base packages
          apt:
            name:
              - build-essential
              - cmake
              - git
              - pkg-config
              - curl
              - wget
              - unzip
            state: present

    # =========================================================================
    # OPENCV WITH CUDA
    # =========================================================================
    - name: OpenCV with CUDA Setup
      tags: [setup, opencv]
      block:
        - name: Check if OpenCV CUDA is already installed
          shell: |
            pkg-config --modversion opencv4 2>/dev/null && \
            python3 -c "import cv2; print('CUDA' if cv2.cuda.getCudaEnabledDeviceCount() > 0 else 'NO_CUDA')" 2>/dev/null
          register: opencv_check
          ignore_errors: yes
          changed_when: false

        - name: Install OpenCV build dependencies
          apt:
            name:
              - libjpeg-dev
              - libpng-dev
              - libtiff-dev
              - libavcodec-dev
              - libavformat-dev
              - libswscale-dev
              - libv4l-dev
              - libxvidcore-dev
              - libx264-dev
              - libgtk-3-dev
              - libatlas-base-dev
              - gfortran
              - python3-dev
              - python3-numpy
              - libgstreamer1.0-dev
              - libgstreamer-plugins-base1.0-dev
              - libgstreamer-plugins-good1.0-dev
              - gstreamer1.0-plugins-base
              - gstreamer1.0-plugins-good
              - gstreamer1.0-plugins-bad
              - gstreamer1.0-plugins-ugly
              - gstreamer1.0-libav
            state: present
          when: "'CUDA' not in opencv_check.stdout"

        - name: Create OpenCV build directory
          file:
            path: "{{ opencv_build_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"

        - name: Clone OpenCV
          git:
            repo: https://github.com/opencv/opencv.git
            dest: "{{ opencv_build_dir }}/opencv"
            version: "{{ opencv_version }}"
            depth: 1
          become_user: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"

        - name: Clone OpenCV contrib
          git:
            repo: https://github.com/opencv/opencv_contrib.git
            dest: "{{ opencv_build_dir }}/opencv_contrib"
            version: "{{ opencv_version }}"
            depth: 1
          become_user: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"

        - name: Create OpenCV build directory
          file:
            path: "{{ opencv_build_dir }}/opencv/build"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"

        - name: Configure OpenCV with CMake
          command: |
            cmake -D CMAKE_BUILD_TYPE=RELEASE \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D OPENCV_EXTRA_MODULES_PATH={{ opencv_build_dir }}/opencv_contrib/modules \
              -D WITH_CUDA=ON \
              -D WITH_CUDNN=ON \
              -D OPENCV_DNN_CUDA=ON \
              -D ENABLE_FAST_MATH=ON \
              -D CUDA_FAST_MATH=ON \
              -D CUDA_ARCH_BIN={{ cuda_arch }} \
              -D WITH_CUBLAS=ON \
              -D WITH_LIBV4L=ON \
              -D WITH_GSTREAMER=ON \
              -D WITH_OPENGL=ON \
              -D WITH_QT=OFF \
              -D BUILD_opencv_python3=ON \
              -D BUILD_opencv_python2=OFF \
              -D BUILD_TESTS=OFF \
              -D BUILD_PERF_TESTS=OFF \
              -D BUILD_EXAMPLES=OFF \
              -D OPENCV_GENERATE_PKGCONFIG=ON \
              ..
          args:
            chdir: "{{ opencv_build_dir }}/opencv/build"
          become_user: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"

        - name: Build OpenCV (this takes ~2 hours)
          command: make -j{{ ansible_processor_vcpus }}
          args:
            chdir: "{{ opencv_build_dir }}/opencv/build"
          become_user: "{{ ansible_user }}"
          when: "'CUDA' not in opencv_check.stdout"
          async: 14400  # 4 hour timeout
          poll: 60

        - name: Install OpenCV
          command: make install
          args:
            chdir: "{{ opencv_build_dir }}/opencv/build"
          when: "'CUDA' not in opencv_check.stdout"
          notify: Reload ldconfig

    # =========================================================================
    # PYTHON ENVIRONMENT
    # =========================================================================
    - name: Python Environment Setup
      tags: [setup, python]
      block:
        - name: Install Python packages
          apt:
            name:
              - python3-pip
              - python3-venv
              - python3-opencv
            state: present

        - name: Create project directory
          file:
            path: "{{ project_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"

        - name: Create Python virtual environment
          command: "{{ python_version }} -m venv {{ venv_dir }}"
          args:
            creates: "{{ venv_dir }}/bin/activate"
          become_user: "{{ ansible_user }}"

        - name: Install Python dependencies
          pip:
            name:
              - numpy
              - opencv-python-headless
              - ultralytics
              - onnxruntime-gpu
              - python-osc
              - requests
            virtualenv: "{{ venv_dir }}"
            state: present
          become_user: "{{ ansible_user }}"

    # =========================================================================
    # YOLO MODEL PREPARATION
    # =========================================================================
    - name: YOLO Model Preparation
      tags: [setup, model]
      block:
        - name: Create model directory
          file:
            path: "{{ model_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"

        - name: Check if ONNX model exists
          stat:
            path: "{{ model_dir }}/{{ yolo_model }}.onnx"
          register: onnx_model

        - name: Export YOLO model to ONNX
          shell: |
            source {{ venv_dir }}/bin/activate
            python3 << 'EOF'
            from ultralytics import YOLO
            model = YOLO('{{ yolo_model }}.pt')
            model.export(format='onnx', imgsz={{ yolo_input_size }}, simplify=True, opset=12, dynamic=False)
            EOF
            mv {{ yolo_model }}.onnx {{ model_dir }}/
          args:
            chdir: "{{ python_dir }}"
            executable: /bin/bash
          become_user: "{{ ansible_user }}"
          when: not onnx_model.stat.exists

    # =========================================================================
    # OPENFRAMEWORKS SETUP
    # =========================================================================
    - name: OpenFrameworks Setup
      tags: [setup, openframeworks]
      block:
        - name: Install OpenFrameworks dependencies
          apt:
            name:
              - libglew-dev
              - libglfw3-dev
              - libfreeimage-dev
              - libasound2-dev
              - libpulse-dev
              - libudev-dev
              - libfreetype6-dev
              - libcurl4-openssl-dev
              - libboost-filesystem-dev
              - librtaudio-dev
              - libglu1-mesa-dev
              - libxrandr-dev
              - libxinerama-dev
              - libxcursor-dev
              - libxi-dev
              - libmpg123-dev
              - liburiparser-dev
            state: present

        - name: Check if OpenFrameworks is installed
          stat:
            path: "{{ of_install_dir }}/libs/openFrameworksCompiled/project/makefileCommon/compile.project.mk"
          register: of_installed

        - name: Download OpenFrameworks
          get_url:
            url: "https://github.com/openframeworks/openFrameworks/releases/download/{{ of_version }}/of_v{{ of_version }}_linux64gcc6_release.tar.gz"
            dest: "/tmp/openframeworks.tar.gz"
          when: not of_installed.stat.exists

        - name: Extract OpenFrameworks
          unarchive:
            src: "/tmp/openframeworks.tar.gz"
            dest: "/home/{{ ansible_user }}"
            remote_src: yes
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
          when: not of_installed.stat.exists

        - name: Rename OpenFrameworks directory
          command: mv /home/{{ ansible_user }}/of_v{{ of_version }}_linux64gcc6_release {{ of_install_dir }}
          args:
            creates: "{{ of_install_dir }}"
          become_user: "{{ ansible_user }}"
          when: not of_installed.stat.exists

        - name: Install OpenFrameworks dependencies script
          command: ./install_dependencies.sh -y
          args:
            chdir: "{{ of_install_dir }}/scripts/linux/ubuntu"
          when: not of_installed.stat.exists

        - name: Compile OpenFrameworks
          command: make Release -j{{ ansible_processor_vcpus }}
          args:
            chdir: "{{ of_install_dir }}/libs/openFrameworksCompiled/project"
          become_user: "{{ ansible_user }}"
          when: not of_installed.stat.exists

    # =========================================================================
    # BUILD OPENFRAMEWORKS APP
    # =========================================================================
    - name: Build OpenFrameworks Application
      tags: [openframeworks, build]
      block:
        - name: Create symbolic link to project in OF apps
          file:
            src: "{{ of_dir }}"
            dest: "{{ of_install_dir }}/apps/myApps/pose_estimate_of"
            state: link
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"

        - name: Clean previous build
          command: make clean
          args:
            chdir: "{{ of_dir }}"
          become_user: "{{ ansible_user }}"
          ignore_errors: yes

        - name: Build OpenFrameworks app
          command: make Release -j{{ ansible_processor_vcpus }}
          args:
            chdir: "{{ of_dir }}"
          become_user: "{{ ansible_user }}"
          register: of_build

        - name: Show build result
          debug:
            msg: "OpenFrameworks app built successfully at {{ of_dir }}/bin/pose_estimate_of"
          when: of_build.rc == 0

    # =========================================================================
    # RUN PYTHON DETECTOR
    # =========================================================================
    - name: Run Python Pose Detector
      tags: [python, run]
      block:
        - name: Run YOLO pose detection (Python)
          shell: |
            source {{ venv_dir }}/bin/activate
            python3 yolo_pose_blender.py \
              --model {{ model_dir }}/{{ yolo_model }}.onnx \
              --source {{ video_source }} \
              --output {{ project_dir }}/poses_output.json
          args:
            chdir: "{{ python_dir }}"
            executable: /bin/bash
          become_user: "{{ ansible_user }}"
          register: python_detector
          when: not use_camera

        - name: Show Python detector output
          debug:
            var: python_detector.stdout_lines
          when: python_detector is defined

    # =========================================================================
    # RUN OPENFRAMEWORKS APP
    # =========================================================================
    - name: Run OpenFrameworks Application
      tags: [openframeworks, run]
      block:
        - name: Check if display is available
          shell: echo $DISPLAY
          register: display_check
          changed_when: false

        - name: Run OpenFrameworks pose detector
          shell: |
            export DISPLAY={{ display_check.stdout | default(':0') }}
            ./bin/pose_estimate_of
          args:
            chdir: "{{ of_dir }}"
          become_user: "{{ ansible_user }}"
          async: 3600
          poll: 0
          register: of_run
          when: display_check.stdout != ""

        - name: Show OF app status
          debug:
            msg: "OpenFrameworks app started (async). Use 'pkill pose_estimate_of' to stop."
          when: of_run is defined

    # =========================================================================
    # CLEANUP
    # =========================================================================
    - name: Cleanup build artifacts
      tags: [cleanup, never]
      block:
        - name: Remove OpenCV build directory
          file:
            path: "{{ opencv_build_dir }}"
            state: absent

        - name: Remove OpenFrameworks download
          file:
            path: "/tmp/openframeworks.tar.gz"
            state: absent

