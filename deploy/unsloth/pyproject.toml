[project]
name = "unsloth-service"
version = "1.0.0"
description = "Local LLM inference service using Unsloth"

dependencies = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "torchvision>=0.18.0",
    "xformers>=0.0.28",
    "accelerate>=0.30.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.1.0",
    "protobuf>=4.25.0",
    "protobuf>=3.20.0",
    "einops>=0.7.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

model-server = [
    "uvicorn[standard]>=0.29.0",
    "fastapi>=0.110.0",
    "sse-starlette>=2.1.0",
]

inference = [
    "unsloth",
    "xformers",
    "accelerate",
]

[tool.setuptools.packages.find]
include = ["inference_middleware*"]
[tool.black]
line-length = 88
target-version = ['py39']
