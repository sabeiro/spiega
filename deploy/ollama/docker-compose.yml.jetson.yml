# Jetson Orin Nano (ARM)
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: ollama-jetson
    ports:
      - "127.0.0.1:11434:11434"
      - "127.0.0.1:18789:18789"
    restart: unless-stopped
    volumes:
      - ~/lav/src/:/root/lav/src
      - ./pi_config/:/root/.pi
    environment:
      - OLLAMA_HOST=0.0.0.0:8080

networks:
  webserver-net:
    name: webserver_jetson-net
    driver: bridge
    external: true
