[my-model]
# Model options - choose one and update the path
# Option 1: Meta-Llama-3.1-8B Instruct (recommended for chat)
# model = /models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf

# Option 2: Gemma-4-12B (requires GPU support)
# model = /models/gemma-4-12b-it-Q4_K_M.gguf

# Option 3: Qwen3-4B (lightweight option)
# model = /models/Qwen3-4B-Thinking-2507.Q4_K_M.gguf

# Path will be auto-detected from available GGUF files in ${MODELS_DIR}
ctx-size = 16384
temp = 0.7
top-p = 0.9
top-k = 50
repeat_penalty = 1.2
n-gpu-layers = -1
